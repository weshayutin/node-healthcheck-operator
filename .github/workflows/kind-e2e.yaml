name: Kind E2E Tests

on:
  push:
    branches: [main*, wes-*, release-*]
  pull_request:
    branches: [main*, release-*]
  workflow_dispatch: {}

jobs:
  e2e-kind:
    #runs-on: ubuntu-24.04
    #runs-on: kind-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Shared dev environment
      TOOLS_DIR: ${{ github.workspace }}/.tools
      MEDIK8S_CLUSTER_NAME: medik8s-ci
      CONTAINER_TOOL: docker

      # Registry (created by dev-setup)
      MEDIK8S_REGISTRY_NAME: kind-registry
      MEDIK8S_REGISTRY_PORT: "5000"
      IMAGE_REGISTRY: kind-registry:5000
      OPM_RENDER_FLAGS: --skip-tls-verify

      # Deployment
      DEPLOY_SNR_NAMESPACE: k8s-test
      DEPLOY_NHC_NAMESPACE: k8s-test

      # Enable GitHub Actions step debug logging
      ACTIONS_STEP_DEBUG: "true"
      ACTIONS_RUNNER_DEBUG: "true"
      

    steps:
    - name: Checkout NHC
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Clone medik8s/tools
      run: |
        git clone --depth 1 --branch testing-hang https://github.com/mpryc/medik8s-tools.git $TOOLS_DIR
        touch $TOOLS_DIR/.managed-by-makefile

    - name: Install operator-sdk
      run: |
        make operator-sdk
        cp ./bin/operator-sdk /usr/local/bin/

    - name: Create Kind cluster with registry, OLM, and cert-manager
      run: make dev-setup

    - name: Cluster info
      run: make dev-cluster-info

    - name: Cluster state (after setup)
      if: ${{ always() }}
      run: |
        echo "=== Nodes ===" && kubectl get nodes -o wide 2>/dev/null || true
        echo "=== All Pods ===" && kubectl get pods -A -o wide 2>/dev/null || true

# --- Deploy SNR from quay.io ---
    - name: Deploy SNR via OLM bundle
      run: |
        kubectl create ns ${DEPLOY_SNR_NAMESPACE} || true
        kubectl label --overwrite ns ${DEPLOY_SNR_NAMESPACE} \
          pod-security.kubernetes.io/enforce=privileged \
          pod-security.kubernetes.io/audit=privileged \
          pod-security.kubernetes.io/warn=privileged
        operator-sdk run bundle -n ${DEPLOY_SNR_NAMESPACE} \
          --timeout 5m \
          quay.io/medik8s/self-node-remediation-operator-bundle:latest

    - name: Cluster state (after SNR deploy)
      if: ${{ always() }}
      run: |
        echo "=== Pods ===" && kubectl get pods -A -o wide 2>/dev/null || true
        echo "=== SNR CRDs ===" && kubectl get crd -o name 2>/dev/null | grep -i remediation || echo "none"
        echo "=== Webhooks ===" && kubectl get mutatingwebhookconfigurations,validatingwebhookconfigurations -o name 2>/dev/null || true
        echo "=== Events (SNR) ===" && kubectl get events -n ${DEPLOY_SNR_NAMESPACE} --sort-by=.lastTimestamp 2>/dev/null | tail -20 || true

    # --- Build and deploy NHC ---
    - name: Build and push NHC
      run: |
        export NHC_SKIP_TEST=true
        make container-build-k8s

        NHC_IMG=${IMAGE_REGISTRY}/node-healthcheck-operator:latest
        NHC_BUNDLE=${IMAGE_REGISTRY}/node-healthcheck-operator-bundle:latest

        # NHC Makefile hardcodes podman for builds, so push with podman too
        podman push --tls-verify=false ${NHC_IMG}
        podman push --tls-verify=false ${NHC_BUNDLE}

    - name: Deploy NHC via OLM bundle
      run: |
        kubectl create ns ${DEPLOY_NHC_NAMESPACE} || true
        kubectl label --overwrite ns ${DEPLOY_NHC_NAMESPACE} \
          pod-security.kubernetes.io/enforce=privileged \
          pod-security.kubernetes.io/audit=privileged \
          pod-security.kubernetes.io/warn=privileged

        operator-sdk run bundle -n ${DEPLOY_NHC_NAMESPACE} --use-http \
          --timeout 5m \
          ${IMAGE_REGISTRY}/node-healthcheck-operator-bundle:latest

        # NHC's aggregated ClusterRole picks up SNR permissions via label selector,
        # but add an explicit binding as a safety net in case aggregation is slow.
        kubectl create clusterrolebinding nhc-snr-admin-binding \
          --clusterrole=self-node-remediation-ext-remediation \
          --serviceaccount=${DEPLOY_NHC_NAMESPACE}:node-healthcheck-operator-controller-manager \
          2>/dev/null || true

    - name: Cluster state (after NHC deploy)
      if: ${{ always() }}
      run: |
        echo "=== Pods ===" && kubectl get pods -A -o wide 2>/dev/null || true
        echo "=== Webhooks ===" && kubectl get mutatingwebhookconfigurations,validatingwebhookconfigurations -o name 2>/dev/null || true
        echo "=== Events (NHC) ===" && kubectl get events -n ${DEPLOY_NHC_NAMESPACE} --sort-by=.lastTimestamp 2>/dev/null | tail -20 || true

    - name: Wait for deployments
      run: |
        # Ensure deployments are Available before proceeding.
        kubectl rollout status deployment/self-node-remediation-controller-manager -n ${DEPLOY_SNR_NAMESPACE} --timeout=120s
        kubectl rollout status deployment/node-healthcheck-controller-manager -n ${DEPLOY_NHC_NAMESPACE} --timeout=120s
        make dev-wait

    - name: Move operator pods to control plane
      run: |
        # E2e tests stop kubelet on worker nodes, which kills pods on those
        # workers. Move operator manager pods to the control-plane node so
        # they survive the simulated failures.
        #
        # NOTE: OLM continuously reconciles deployment specs to match the CSV.
        # It will revert these patches eventually. We patch AFTER rollout is
        # complete and immediately wait for the new rollout so the pods have
        # time to reschedule before OLM reverts. The sleep below also gives
        # OLM time to finish its reconciliation cycle.
        kubectl patch deployment self-node-remediation-controller-manager -n ${DEPLOY_SNR_NAMESPACE} \
          -p '{"spec": {"template": {"spec": {"nodeSelector": {"node-role.kubernetes.io/control-plane": ""}, "tolerations": [{"key": "node-role.kubernetes.io/control-plane", "operator": "Exists", "effect": "NoSchedule"}]}}}}' || true

        kubectl patch deployment node-healthcheck-controller-manager -n ${DEPLOY_NHC_NAMESPACE} \
          -p '{"spec": {"template": {"spec": {"nodeSelector": {"node-role.kubernetes.io/control-plane": ""}, "tolerations": [{"key": "node-role.kubernetes.io/control-plane", "operator": "Exists", "effect": "NoSchedule"}]}}}}' || true

        kubectl rollout status deployment/self-node-remediation-controller-manager -n ${DEPLOY_SNR_NAMESPACE} --timeout=120s
        kubectl rollout status deployment/node-healthcheck-controller-manager -n ${DEPLOY_NHC_NAMESPACE} --timeout=120s

    - name: Cluster state (after move to control plane)
      if: ${{ always() }}
      run: |
        echo "=== Pods ===" && kubectl get pods -A -o wide 2>/dev/null || true
        echo "=== Deployments ===" && kubectl get deployments -A 2>/dev/null || true

    - name: Wait for controllers to stabilize
      run: |
        # Controllers need time after pods are Ready to complete leader election
        # (default LeaseDuration=15s) and initial reconciliation (informer sync,
        # RBAC aggregation setup, namespace creation for leases, etc.).
        # Without this wait the e2e tests race against controller startup and
        # the NHC reconciler may not yet be active when nodes are made unhealthy.
        echo "Waiting 30s for leader election and controller initialization..."
        sleep 30

        # Verify the NHC controller has started reconciling by checking that
        # the aggregation ClusterRole was created (done in the initializer
        # which runs after leader election).
        if kubectl get clusterrole node-healthcheck-operator-aggregation &>/dev/null; then
          echo "NHC aggregation ClusterRole found — controller is active."
        else
          echo "WARNING: aggregation ClusterRole not found, controller may not be ready yet. Waiting 30s more..."
          sleep 30
        fi

    - name: Dump webhook configurations after bundle installs
      run: |
        # Both SNR and NHC bundles register webhooks for SNR resources.
        # Dump them to help diagnose duplicate/broken webhook issues.
        echo "=== MutatingWebhookConfiguration YAML ==="
        kubectl get mutatingwebhookconfigurations -o yaml
        echo ""
        echo "=== ValidatingWebhookConfiguration YAML ==="
        kubectl get validatingwebhookconfigurations -o yaml

    - name: Deployment status
      if: ${{ always() }}
      run: make dev-describe

    # --- Pre-flight checks ---
    - name: Verify NHC readiness
      run: |
        echo "=== NHC Controller Pod ==="
        kubectl get pods -n ${DEPLOY_NHC_NAMESPACE} -l app.kubernetes.io/name=node-healthcheck-operator -o wide
        echo ""
        echo "=== SNR Template CRDs ==="
        kubectl get crd selfnoderemediationtemplates.self-node-remediation.medik8s.io 2>/dev/null && echo "CRD exists" || echo "CRD MISSING"
        kubectl get crd selfnoderemediations.self-node-remediation.medik8s.io 2>/dev/null && echo "CRD exists" || echo "CRD MISSING"
        echo ""
        echo "=== RBAC Aggregation ==="
        kubectl get clusterrole node-healthcheck-operator-aggregation -o yaml 2>/dev/null || echo "Aggregation ClusterRole NOT FOUND"
        echo ""
        echo "=== ext-remediation ClusterRole (from SNR bundle) ==="
        kubectl get clusterrole self-node-remediation-ext-remediation -o yaml 2>/dev/null || echo "ext-remediation ClusterRole NOT FOUND"
        echo ""
        echo "=== NHC Controller Logs (last 30 lines) ==="
        NHC_POD=$(kubectl get pods -n ${DEPLOY_NHC_NAMESPACE} -o name 2>/dev/null | grep node-healthcheck-controller-manager | head -1 | cut -d/ -f2)
        if [ -n "$NHC_POD" ]; then
          kubectl logs -n ${DEPLOY_NHC_NAMESPACE} "$NHC_POD" --tail=30 2>/dev/null || true
        else
          echo "NHC controller pod not found!"
        fi
        echo ""
        echo "=== Webhook Configurations ==="
        kubectl get validatingwebhookconfigurations -o name 2>/dev/null | grep -i 'node\|nhc\|snr\|remediation' || echo "none"
        kubectl get mutatingwebhookconfigurations -o name 2>/dev/null | grep -i 'node\|nhc\|snr\|remediation' || echo "none"

    # --- Run tests ---
    - name: Run e2e tests
      run: |
        # The reboot watcher simulates node reboot on Kind by restarting the
        # Docker container when kubelet stops. It must run in the same step as
        # the tests so GH Actions keeps the background process alive.
        # MEDIK8S_REBOOT_DELAY gives NHC time to detect the unhealthy node
        # and create the remediation CR before the node comes back.
        # Timeline: kubelet stops → ~40s node NotReady → +15s unhealthyConditionDuration
        # → NHC creates remediation CR → SNR processes it.
        # Delay must exceed 40+15+buffer ≈ 65s so the node stays down long enough.
        export MEDIK8S_REBOOT_DELAY=90
        make dev-reboot-watcher

        echo "=== Verifying Operator Pods ==="
        kubectl get pods -n ${DEPLOY_SNR_NAMESPACE} -o wide
        kubectl get pods -n ${DEPLOY_NHC_NAMESPACE} -o wide

        OPERATOR_NS=${DEPLOY_NHC_NAMESPACE} \
        SNR_STRATEGY=OutOfServiceTaint \
        LABEL_FILTER="!OCP-ONLY" \
        make test-e2e

    - name: Debug on failure
      if: ${{ !success() }}
      run: |
        echo "=== NHC Status ==="
        kubectl get nodehealthchecks -o yaml 2>/dev/null || true
        echo ""
        echo "=== SelfNodeRemediation CRs ==="
        kubectl get selfnoderemediations -A -o yaml 2>/dev/null || true
        echo ""
        echo "=== SelfNodeRemediationTemplates ==="
        kubectl get selfnoderemediationtemplates -A -o yaml 2>/dev/null || true
        echo ""
        echo "=== Node Status ==="
        kubectl get nodes -o wide 2>/dev/null || true
        echo ""
        echo "=== NHC Events ==="
        kubectl get events -A --sort-by=.lastTimestamp --field-selector reason!=Pulling,reason!=Pulled 2>/dev/null | grep -iE 'healthcheck|remediat|disabled|enabled|template|unhealthy' || echo "No NHC-related events"
        echo ""
        make dev-ci-debug
